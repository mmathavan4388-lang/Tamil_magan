<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KABERIAL PATTASU KADAI</title>
    <!--
      GitHub Pages has no server-side routing, so any deep link (e.g. /products/p-1)
      returns this 404 page. We redirect the browser back to the app's index.html,
      encoding the original path in the query string so the app can restore it.
      Based on the well-known spa-github-pages technique.
    -->
    <script>
      var pathSegmentsToKeep = 1; // keep "/Tamil_magan"
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
